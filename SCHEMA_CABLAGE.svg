<text x="65" y="980" class="label">USB : GPIO19 = D− ; GPIO20 = D+. Aucune connexion ajoutée sur ces broches.</text>
<text x="65" y="1017" class="small">Le pinout fourni inverse D+ et D−. Le port UART sert au REPL / flash ; le HID passe par le port USB natif.</text>
<text x="65" y="1053" class="small">Résistances : 330 Ω + 2,2 kΩ + 10 kΩ, 1/4 W. La 330 Ω reste obligatoire, même avec un PWM faible.</text>
